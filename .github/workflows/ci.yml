name: Delivery Gate
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run unit
      - run: npm run build
      - name: Secret pattern gate
        run: '! git grep -nE "(service_role|channel access token).{0,20}(eyJ|[A-Za-z0-9_-]{40})" -- ":(exclude).env.example"'
